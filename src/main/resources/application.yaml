# Configuração comum a todos os perfis. O que muda por ambiente fica em application-<perfil>.yaml (RNF21).
spring:
  application:
    name: fintrack

  profiles:
    # Sem SPRING_PROFILES_ACTIVE, sobe em dev. Em produção o perfil será definido por variável de ambiente (Etapa 9).
    default: dev

  jpa:
    hibernate:
      # O schema é criado pelo Flyway (src/main/resources/db/migration). O Hibernate só confere.
      ddl-auto: validate
    # Sem Open Session in View: acesso LAZY fora do service falha na hora, em vez de gerar consultas escondidas.
    open-in-view: false
    properties:
      hibernate:
        # Coleções LAZY (ex.: tags de várias transações) carregadas em lotes de até 50 com um IN (...),
        # em vez de uma consulta por transação (N+1).
        default_batch_fetch_size: 50

  flyway:
    enabled: true

  servlet:
    multipart:
      # Extrato OFX mensal tem poucos KB. O limite protege o servidor exposto na internet (ADR-007).
      max-file-size: 5MB
      max-request-size: 6MB

# Acesso por token único (ADR-008). Sem valor padrão aqui: em produção, FINTRACK_TOKEN é obrigatório
# e a aplicação não sobe sem ele (ou com menos de 32 caracteres).
fintrack:
  seguranca:
    token: ${FINTRACK_TOKEN:}

# Só o health check fica exposto (RNF14), e sem detalhes (não revela banco, disco etc. na internet).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
