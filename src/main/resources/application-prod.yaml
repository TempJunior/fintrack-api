# Produção (EC2 + docker compose, atrás do Caddy — ADR-007). Tudo que é sensível vem do ambiente (RNF09).
# Ative com SPRING_PROFILES_ACTIVE=prod.
#
# Variáveis obrigatórias:
#   FINTRACK_TOKEN        token de acesso do app (>= 32 caracteres aleatórios)
#   FINTRACK_DB_URL       ex.: jdbc:postgresql://postgres:5432/fintrack
#   FINTRACK_DB_USER
#   FINTRACK_DB_PASSWORD
#
# ATENÇÃO: o driver do PostgreSQL ainda não está no pom (incremento 1.3, adiado). Este perfil só sobe
# depois dele.
spring:
  datasource:
    url: ${FINTRACK_DB_URL}
    username: ${FINTRACK_DB_USER}
    password: ${FINTRACK_DB_PASSWORD}

  jpa:
    show-sql: false

  h2:
    console:
      enabled: false

# Sem documentação da API exposta na internet (arquitetura §9.3).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Atrás do Caddy: usa os cabeçalhos X-Forwarded-* para montar URLs (Location com https) e
  # registrar o IP real do cliente nos logs.
  forward-headers-strategy: framework
