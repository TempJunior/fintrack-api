# Testes com Spring (@SpringBootTest + @ActiveProfiles("test")): H2 na memória em modo PostgreSQL,
# schema criado pelo mesmo Flyway de dev. Será trocado por Testcontainers quando o Postgres entrar.
spring:
  datasource:
    url: jdbc:h2:mem:fintrack-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    show-sql: false
    properties:
      hibernate:
        # Permite aos testes contar quantas consultas SQL uma operação fez (ex.: provar que não há N+1).
        generate_statistics: true

  h2:
    console:
      enabled: false

fintrack:
  seguranca:
    token: token-de-teste-com-pelo-menos-32-caracteres
